function auctionProperty() {

    const match = containsProperty(
        document.getElementById("propertyName").value
    );

    const property = match ? match : {
        color: document.getElementById("propertyColor").value,
        name: document.getElementById("propertyName").value,
        cost: Number(document.getElementById("propertyCost").value),
        rent: Number(document.getElementById("baseRent").value),
        rentFull: Number(document.getElementById("baseRent").value) * 2,
        rent1: Number(document.getElementById("1Rent").value),
        rent2: Number(document.getElementById("2Rent").value),
        rent3: Number(document.getElementById("3Rent").value),
        rent4: Number(document.getElementById("4Rent").value),
        Hrent: Number(document.getElementById("HRent").value),
        buildCost: Number(document.getElementById("buildCost").value)
    };

    //--------------------------------------------------
    // Property evaluation
    //--------------------------------------------------

    const value = tradePropertyValue(property);

    const owned =
        mi.properties.filter(
            p => p.color === property.color
        ).length;

    const exception =
        exceptions.find(
            e => e.color === property.color
        );

    const required =
        exception ? exception.amount : 3;

    const completesMonopoly =
        owned + 1 >= required;

    //--------------------------------------------------
    // Does this block another player?
    //--------------------------------------------------

    let blocksOpponent = false;

    if (propertyOwners) {

        const owners = {};

        for (const [name, owner] of Object.entries(propertyOwners)) {

            const p = containsProperty(name);

            if (!p) continue;

            if (!owners[owner])
                owners[owner] = {};

            owners[owner][p.color] =
                (owners[owner][p.color] || 0) + 1;
        }

        for (const owner in owners) {

            const count =
                owners[owner][property.color] || 0;

            if (count === required - 1) {

                blocksOpponent = true;
                break;

            }
        }
    }

    //--------------------------------------------------
    // Reserve cash
    //--------------------------------------------------

    let reserve = 150;

    if (completesMonopoly)
        reserve = 25;

    //--------------------------------------------------
    // Maximum bid
    //--------------------------------------------------

    let auctionMax;

    if (completesMonopoly) {

        // Almost everything.
        auctionMax =
            Math.min(
                mi.money - reserve,
                Math.round(value)
            );

    } else if (blocksOpponent) {

        auctionMax =
            Math.min(
                mi.money - 75,
                Math.round(value * 0.90)
            );

    } else {

        auctionMax =
            Math.min(
                mi.money - reserve,
                Math.round(value * 0.75)
            );

    }

    //--------------------------------------------------
    // Color adjustments
    //--------------------------------------------------

    switch (property.color) {

        case "orange":
            auctionMax += 150;
            break;

        case "red":
            auctionMax += 100;
            break;

        case "pink":
            auctionMax += 50;
            break;

        case "utility":
            auctionMax -= 75;
            break;

        case "railroad":
            auctionMax += 40;
            break;
    }

    //--------------------------------------------------
    // Clamp values
    //--------------------------------------------------

    auctionMax = Math.max(10, auctionMax);

    auctionMax = Math.min(
        auctionMax,
        mi.money - reserve
    );

    //--------------------------------------------------
    // Output
    //--------------------------------------------------

    log(
        "MI auctions " +
        property.name +
        ", MI will at maximum bid $" +
        auctionMax
    );

    lines++;
    update();
}

function evaluateProperty(property) {

    //--------------------------------------------------
    // How valuable is this property?
    //--------------------------------------------------

    const value = tradePropertyValue(property);

    //--------------------------------------------------
    // Cash reserve
    //--------------------------------------------------

    let reserve = 150;

    // Will this complete a monopoly?
    const owned =
        mi.properties.filter(
            p => p.color === property.color
        ).length;

    const exception =
        exceptions.find(
            e => e.color === property.color
        );

    const required =
        exception ? exception.amount : 3;

    const completesMonopoly =
        owned + 1 >= required;

    //--------------------------------------------------
    // If it completes a monopoly, become aggressive
    //--------------------------------------------------

    if (completesMonopoly) {

        reserve = 50;

    }

    //--------------------------------------------------
    // Block another player?
    //--------------------------------------------------

    let blocksOpponent = false;

    if (propertyOwners) {

        const owners = {};

        for (const [name, owner] of Object.entries(propertyOwners)) {

            const p = containsProperty(name);

            if (!p)
                continue;

            if (!owners[owner])
                owners[owner] = {};

            owners[owner][p.color] =
                (owners[owner][p.color] || 0) + 1;

        }

        for (const owner in owners) {

            const count =
                owners[owner][property.color] || 0;

            if (count === required - 1) {

                blocksOpponent = true;
                break;

            }

        }

    }

    //--------------------------------------------------
    // Emergency purchases
    //--------------------------------------------------

    if (completesMonopoly && mi.money >= property.cost) {

        buy(property);
        return;

    }

    if (
        blocksOpponent &&
        mi.money - property.cost >= 100
    ) {

        buy(property);
        return;

    }

    //--------------------------------------------------
    // Value-based buying
    //--------------------------------------------------

    const ratio = value / property.cost;

    if (
        ratio >= 1.45 &&
        mi.money - property.cost >= reserve
    ) {

        buy(property);
        return;

    }

    //--------------------------------------------------
    // Excellent bargains
    //--------------------------------------------------

    if (
        property.cost <= value * 0.55 &&
        mi.money - property.cost >= reserve
    ) {

        buy(property);
        return;

    }

    //--------------------------------------------------
    // Otherwise auction
    //--------------------------------------------------

    let auctionMax = Math.max(
        10,
        Math.min(
            Math.round(value * 0.85),
            mi.money - reserve
        )
    );

    log(
        "MI auctions " +
        property.name +
        ", MI will at maximum bid $" +
        auctionMax
    );

    lines++;
    update();

}

function containsProperty(input) {
    const normalizedInput = input
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll(".", "");

    return monopolyProperties.find(property => {
        const normalizedName = property.name
            .toLowerCase()
            .replaceAll(" ", "")
            .replaceAll(".", "");

        return normalizedInput.includes(normalizedName) ||
               normalizedName.includes(normalizedInput);
    });
}
function remainingInSet(property) {
    const owned = mi.properties.filter(obj => obj.color === property.color).length;
    const exception = exceptions.find(obj => obj.color === property.color);

    if (exception) {
        return exception.amount - owned;
    }

    return 3 - owned;
}
function hasMonopoly(color) {
    const exception = exceptions.find(obj => obj.color === color);

    const required = exception ? exception.amount : 3;

    return mi.properties.filter(property =>
        property.color === color &&
        !property.mortgaged
    ).length >= required;
}
function getSet(color) {
    return mi.properties
        .filter(property =>
            property.color === color &&
            !property.mortgaged
        )
        .sort((a, b) => a.cost - b.cost);
}
function buildingLevel(property) {
    return property.hotel ? 5 : property.houses;
}
function canBuild(property) {

    // Can't build on railroads or utilities
    if (property.color === "railroad" || property.color === "utility") {
        return false;
    }

    // Must own the monopoly
    if (!hasMonopoly(property.color)) {
        return false;
    }

    // Can't build on mortgaged properties
    if (property.mortgaged) {
        return false;
    }

    // Already has a hotel
    if (property.hotel) {
        return false;
    }

    const set = getSet(property.color);

    // Compare building levels (hotel counts as 5)
    const minimum = Math.min(...set.map(buildingLevel));

    return buildingLevel(property) === minimum;
}
function buyHouses() {

    const reserve = 125; // MI tries to keep this much cash

    let built = true;

    while (built) {

        built = false;

        for (const property of mi.properties) {

            if (!canBuild(property)) {
                continue;
            }

            // Enough money?
            if (mi.money - property.buildCost < reserve) {
                return;
            }

            // Build a house
            if (property.houses < 4) {

                property.houses++;
                mi.money -= property.buildCost;

                log(
                    "MI builds a house on " +
                    property.name +
                    " for $" +
                    property.buildCost
                );

                show();
                lines++;
                update();

                built = true;
            }

            // Upgrade to hotel
            else {

                const set = getSet(property.color);

                // Every property must already have four houses or a hotel
                if (set.every(p => buildingLevel(p) >= 4)) {

                    if (mi.money - property.buildCost < reserve) {
                        return;
                    }

                    property.houses = 0;
                    property.hotel = true;

                    mi.money -= property.buildCost;

                    log(
                        "MI builds a hotel on " +
                        property.name +
                        " for $" +
                        property.buildCost
                    );

                    show();
                    lines++;
                    update();

                    built = true;
                }
            }
        }
    }
}
function canSell(property) {

    if (!hasMonopoly(property.color)) {
        return false;
    }

    const set = getSet(property.color);

    const maximum = Math.max(...set.map(buildingLevel));

    // Hotels can only be sold if they're tied for the highest level
    if (property.hotel) {
        return buildingLevel(property) === maximum;
    }

    if (property.houses <= 0) {
        return false;
    }

    return buildingLevel(property) === maximum;
}
function sellBuildings() {
    const reserve = 100; // Minimum cash MI wants before mortgaging

    if (mi.money >= reserve) {
        return;
    }

    let sold = true;

    while (sold && mi.money < reserve) {
        sold = false;

        for (const property of mi.properties) {

            if (!canSell(property)) {
                continue;
            }

            // Sell hotel back into four houses
            if (property.hotel) {
                property.hotel = false;
                property.houses = 4;

                mi.money += property.buildCost / 2;

                log(
                    "MI sells hotel on " +
                    property.name +
                    " for $" +
                    (property.buildCost / 2)
                );

                show();

                lines++;
                update();

                sold = true;
                break;
            }

            // Sell houses
            if (property.houses > 0) {
                property.houses--;

                mi.money += property.buildCost / 2;

                log(
                    "MI sells a house on " +
                    property.name +
                    " for $" +
                    (property.buildCost / 2)
                );

                show();

                lines++;
                update();

                sold = true;
                break;
            }
        }
    }
}
function mortgage() {
    // First try selling buildings
    sellBuildings();

    if (mi.money >= 100) {
        return;
    }

    // Count owned properties by color
    let colors = [];

    mi.properties.forEach(property => {
        const color = colors.find(obj => obj.color === property.color);

        if (!color) {
            colors.push({
                color: property.color,
                amount: 1
            });
        } else {
            color.amount++;
        }
    });

    // Mortgage singleton colors first
    for (const color of colors.filter(c => c.amount === 1)) {
        if (mi.money >= 100) {
            break;
        }

        const property = mi.properties.find(
            p => p.color === color.color &&
                 !p.mortgaged &&
                 p.houses === 0 &&
                 !p.hotel
        );

        if (property) {
            property.mortgaged = true;
            mi.money += property.cost / 2;

            show();

            log(
                "MI mortgages " +
                property.name +
                " for $" +
                (property.cost / 2)
            );

            lines++;
            update();
        }
    }

    // Mortgage remaining cheapest properties if needed
    if (mi.money < 100) {
        const remaining = mi.properties
            .filter(p =>
                !p.mortgaged &&
                p.houses === 0 &&
                !p.hotel
            )
            .sort((a, b) => a.cost - b.cost);

        for (const property of remaining) {

            if (mi.money >= 100) {
                break;
            }

            property.mortgaged = true;
            mi.money += property.cost / 2;

            show();

            log(
                "MI mortgages " +
                property.name +
                " for $" +
                (property.cost / 2)
            );

            lines++;
            update();
        }
    }
}
function buy(property) {
    // Create a copy so the master property list isn't modified
    const ownedProperty = {
        ...property,
        houses: 0,
        hotel: false,
        mortgaged: false
    };

    mi.properties.push(ownedProperty);
	delete propertyOwners[property.name];

    mi.money -= property.cost;

    show();
    log("MI purchases " + property.name + " for $" + property.cost);

    lines++;
    update();

    buyHouses();
}
function run() {
    mortgage();
    buyHouses();
	const trade = suggestTrades();
	if (trade) used.push(trade);

    setTimeout(run, 1000);
}
function setOwner(propertyName, owner) {

    const property = containsProperty(propertyName);

    if (!property) {

        log("Unknown property: " + propertyName);

        lines++;
        update();

        return;
    }


    propertyOwners[property.name] = owner;


    log(
        owner + " owns " + property.name
    );

    lines++;
    update();

}
function transferOwner(propertyName, newOwner) {

    const property =
        containsProperty(propertyName);


    if (!property) {

        log("Unknown property: " + propertyName);

        lines++;
        update();

        return;
    }


    propertyOwners[property.name] = newOwner;


    log(
        property.name +
        " transferred to " +
        newOwner
    );

    lines++;
    update();

}

function updateOwner(propertyName, owner) {

    const property = containsProperty(propertyName);

    if (!property) {

        log("Unknown property: " + propertyName);

        lines++;
        update();

        return;
    }

    propertyOwners[property.name] = owner;

    log(owner + " now owns " + property.name);

    lines++;
    update();
}
function getPropertyOwner(propertyName) {

    const property = containsProperty(propertyName);

    if (!property)
        return null;

    return propertyOwners[property.name] || null;
}
function suggestTrades() {

    //--------------------------------------------------
    // Search every incomplete color set
    //--------------------------------------------------

    for (const color of [...new Set(monopolyProperties.map(p => p.color))]) {

        if (hasMonopoly(color))
            continue;

        const owned =
            mi.properties.filter(
                p => p.color === color
            ).length;

        const exception =
            exceptions.find(
                e => e.color === color
            );

        const required =
            exception ? exception.amount : 3;

        // Only pursue if exactly one property is missing
        if (owned !== required - 1)
            continue;

        //--------------------------------------------------
        // Find missing property
        //--------------------------------------------------

        const missing =
            monopolyProperties.find(p =>
                p.color === color &&
                !getOwnedProperty(p.name)
            );

        if (!missing)
            continue;

        const owner =
            getPropertyOwner(missing.name);

        if (!owner)
            continue;

        //--------------------------------------------------
        // Build candidate assets
        //--------------------------------------------------

        let candidates =
            mi.properties
            .filter(p =>
                p.color !== color &&
                !hasMonopoly(p.color)
            )
            .sort((a,b)=>
                tradePropertyValue(a)-
                tradePropertyValue(b)
            );

        //--------------------------------------------------
        // Determine cash offer
        //--------------------------------------------------

        let maxCash =
            Math.max(
                0,
                mi.money - 200
            );

        let cashOffer = Math.min(
            700,
            Math.round(tradePropertyValue(missing)*0.35),
            maxCash
        );

        //--------------------------------------------------
        // Build increasingly aggressive offers
        //--------------------------------------------------

        const offers = [];

        // Cash only
        if (cashOffer > 0)
            offers.push({
                give:["$"+cashOffer],
                receive:[missing.name]
            });

        // Cheapest property
        if (candidates.length){

            offers.push({
                give:[
                    candidates[0].name
                ],
                receive:[
                    missing.name
                ]
            });

        }

        // Property + cash
        if (candidates.length && cashOffer>0){

            offers.push({
                give:[
                    candidates[0].name,
                    "$"+cashOffer
                ],
                receive:[
                    missing.name
                ]
            });

        }

        // Two cheap properties
        if (candidates.length>=2){

            offers.push({
                give:[
                    candidates[0].name,
                    candidates[1].name
                ],
                receive:[
                    missing.name
                ]
            });

        }

        // Two properties + cash
        if (candidates.length>=2 && cashOffer>0){

            offers.push({
                give:[
                    candidates[0].name,
                    candidates[1].name,
                    "$"+cashOffer
                ],
                receive:[
                    missing.name
                ]
            });

        }

        //--------------------------------------------------
        // Find first acceptable offer
        //--------------------------------------------------

        for(const trade of offers){

            if(
                used.some(item=>
                    JSON.stringify(item)===
                    JSON.stringify(trade)
                )
            )
                continue;

            if(!evaluateTrade(trade,false))
                continue;

            used.push(trade);

            log(
                "MI proposes trade to "+
                owner+":"
            );

            lines++;
            update();

            log(
                "Give: "+
                trade.give.join(" + ")
            );

            lines++;
            update();

            log(
                "Receive: "+
                trade.receive.join(" + ")
            );

            lines++;
            update();

            log(
                "MI believes this trade is favorable."
            );

            lines++;
            update();

            return trade;
        }

    }

    return false;
}




function evaluateTrade(trade, showDetails = true) {

    let receiveValue = 0;
    let giveValue = 0;

    //--------------------------------------------------
    // Evaluate what MI gives
    //--------------------------------------------------

    for (const item of trade.give) {

        if (item.startsWith("$")) {

            giveValue += Number(item.replace("$",""));
            continue;

        }

        const property = getOwnedProperty(item);

        if (!property)
            return false;

        let value = tradePropertyValue(property);

        // Never willingly break a monopoly
        if (hasMonopoly(property.color))
            value += 3000;

        giveValue += value;
    }

    //--------------------------------------------------
    // Evaluate what MI receives
    //--------------------------------------------------

    let completesMonopoly = false;

    for (const item of trade.receive) {

        if (item.startsWith("$")) {

            receiveValue += Number(item.replace("$",""));
            continue;

        }

        const property = containsProperty(item);

        if (!property)
            return false;

        let value = tradePropertyValue({
            ...property,
            houses:0,
            hotel:false,
            mortgaged:false
        });

        const owned =
            mi.properties.filter(
                p=>p.color===property.color
            ).length;

        const exception =
            exceptions.find(
                e=>e.color===property.color
            );

        const required =
            exception ? exception.amount : 3;

        if (owned + 1 >= required){

            value += 3500;
            completesMonopoly = true;

        }
        else if (owned === required - 2){

            value += 900;

        }

        receiveValue += value;
    }

    //--------------------------------------------------
    // Cash reserve penalty
    //--------------------------------------------------

    const cashGiven =
        trade.give
        .filter(i=>i.startsWith("$"))
        .reduce(
            (a,b)=>a+Number(b.replace("$","")),
            0
        );

    const cashRemaining =
        mi.money - cashGiven;

    if (cashRemaining < 200)
        giveValue += (200-cashRemaining)*3;

    //--------------------------------------------------
    // Trade advantage
    //--------------------------------------------------

    const advantage =
        receiveValue - giveValue;

    //--------------------------------------------------
    // Display analysis
    //--------------------------------------------------

    if (showDetails){

        log(
            "Trade received value: "+
            Math.round(receiveValue)
        );

        lines++;
        update();

        log(
            "Trade given value: "+
            Math.round(giveValue)
        );

        lines++;
        update();

        log(
            "Trade advantage: "+
            Math.round(advantage)
        );

        lines++;
        update();

    }

    //--------------------------------------------------
    // Decision
    //--------------------------------------------------

    if (completesMonopoly){

        // Willing to slightly overpay
        return advantage >= -500;

    }

    return advantage >= 0;

}



function getOwnedProperty(name) {

    const normalized = name
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll(".", "")
        .replaceAll(",", "");

    return mi.properties.find(property => {

        const propertyName = property.name
            .toLowerCase()
            .replaceAll(" ", "")
            .replaceAll(".", "")
            .replaceAll(",", "");

        return normalized.includes(propertyName) ||
               propertyName.includes(normalized);
    });
}
function tradePropertyValue(property) {

    //--------------------------------------------------
    // BASE VALUE
    //--------------------------------------------------

    let value = property.cost;

    //--------------------------------------------------
    // LANDING FREQUENCY
    //--------------------------------------------------

    const landingWeight = {
        "brown": 0.90,
        "light blue": 1.25,
        "pink": 1.50,
        "orange": 2.25,
        "red": 2.00,
        "yellow": 1.45,
        "green": 1.15,
        "dark blue": 1.05,
        "railroad": 1.70,
        "utility": 0.75
    };

    const weight =
        landingWeight[property.color] || 1;

    value +=
        property.rent *
        weight *
        8;

    value +=
        property.Hrent *
        weight *
        0.75;

    //--------------------------------------------------
    // BUILDING POTENTIAL
    //--------------------------------------------------

    if (property.buildCost > 0) {

        value +=
            property.rent1 *
            weight *
            1.5;

        value +=
            property.rent2 *
            weight *
            1.2;

        value +=
            property.rent3 *
            weight *
            1.0;

        value +=
            property.rent4 *
            weight *
            0.8;

        value +=
            property.Hrent *
            weight *
            0.7;

        // Cheap development is extremely valuable.
        if (property.buildCost <= 50)
            value += 500;

        else if (property.buildCost <= 100)
            value += 400;

        else if (property.buildCost <= 150)
            value += 250;

        else if (property.buildCost <= 200)
            value += 100;
    }

    //--------------------------------------------------
    // EXISTING BUILDINGS
    //--------------------------------------------------

    const houses =
        property.houses || 0;

    if (houses > 0) {

        value +=
            houses *
            property.buildCost *
            2.0;
    }

    if (property.hotel) {

        value +=
            property.buildCost *
            10;

        value +=
            property.Hrent *
            1.5;
    }

    //--------------------------------------------------
    // SET INFORMATION
    //--------------------------------------------------

    const owned =
        mi.properties.filter(
            p => p.color === property.color
        ).length;

    const exception =
        exceptions.find(
            e => e.color === property.color
        );

    const required =
        exception
            ? exception.amount
            : 3;

    const remaining =
        Math.max(
            0,
            required - owned
        );

    //--------------------------------------------------
    // SET PROGRESS
    //--------------------------------------------------

    // This property completes the set.
    if (owned + 1 >= required) {

        value += 4000;

        // Completion becomes even more valuable
        // when development is cheap.
        if (
            property.buildCost > 0 &&
            property.buildCost <= 100
        ) {
            value += 750;
        }

        // Orange/red monopolies are particularly dangerous.
        if (property.color === "orange")
            value += 750;

        if (property.color === "red")
            value += 600;

        if (property.color === "pink")
            value += 350;

        if (property.color === "light blue")
            value += 300;
    }

    // One property away from completion.
    else if (owned === required - 2) {

        value += 1300;

        if (property.buildCost > 0 &&
            property.buildCost <= 100)
        {
            value += 350;
        }
    }

    // Has some investment in this color.
    else if (owned > 0) {

        value +=
            owned * 350;
    }

    //--------------------------------------------------
    // ALREADY-COMPLETED MONOPOLY
    //--------------------------------------------------

    if (hasMonopoly(property.color)) {

        value += 1800;

        // Additional properties in an owned monopoly
        // are useful as bargaining/trade assets.
        value += 250;
    }

    //--------------------------------------------------
    // DEVELOPMENT QUALITY
    //--------------------------------------------------

    if (property.buildCost > 0) {

        // Properties with large rent jumps deserve
        // additional strategic value.
        const developmentJump =
            property.Hrent -
            property.rent;

        if (developmentJump >= 500)
            value += 500;

        else if (developmentJump >= 300)
            value += 300;

        else if (developmentJump >= 150)
            value += 150;
    }

    //--------------------------------------------------
    // ORANGE / RED PRIORITY
    //--------------------------------------------------

    // These groups are strategically dangerous because
    // they combine strong landing frequency with strong
    // developed rents.
    if (property.color === "orange") {

        value += 700;

        if (owned > 0)
            value += 600;
    }

    if (property.color === "red") {

        value += 550;

        if (owned > 0)
            value += 450;
    }

    if (property.color === "pink") {

        value += 250;
    }

    //--------------------------------------------------
    // RAILROADS
    //--------------------------------------------------

    if (property.color === "railroad") {

        const ownedRR =
            mi.properties.filter(
                p => p.color === "railroad"
            ).length;

        // Value increases sharply as MI accumulates RR.
        if (ownedRR === 0)
            value += 150;

        else if (ownedRR === 1)
            value += 450;

        else if (ownedRR === 2)
            value += 900;

        else if (ownedRR === 3)
            value += 2200;

        // Completing all four.
        if (ownedRR + 1 >= 4)
            value += 2500;
    }

    //--------------------------------------------------
    // UTILITIES
    //--------------------------------------------------

    if (property.color === "utility") {

        value -= 100;

        // Two utilities are substantially better
        // than one.
        const ownedUtilities =
            mi.properties.filter(
                p => p.color === "utility"
            ).length;

        if (ownedUtilities === 1)
            value += 450;
    }

    //--------------------------------------------------
    // OPPONENT ANALYSIS
    //--------------------------------------------------

    if (propertyOwners) {

        const opponents = {};

        //--------------------------------------------------
        // Count every opponent's holdings by color
        //--------------------------------------------------

        for (
            const [name, owner]
            of Object.entries(propertyOwners)
        ) {

            const p =
                containsProperty(name);

            if (!p)
                continue;

            if (!opponents[owner])
                opponents[owner] = {};

            opponents[owner][p.color] =
                (opponents[owner][p.color] || 0) + 1;
        }

        //--------------------------------------------------
        // Evaluate every opponent
        //--------------------------------------------------

        for (
            const owner in opponents
        ) {

            const opponentCount =
                opponents[owner][property.color] || 0;

            //--------------------------------------------------
            // BLOCK A NEAR-MONOPOLY
            //--------------------------------------------------

            if (
                opponentCount === required - 1
            ) {

                // Preventing a monopoly is extremely valuable.
                value += 2200;

                // Especially important when the group
                // is a strong developed group.
                if (property.color === "orange")
                    value += 900;

                if (property.color === "red")
                    value += 750;

                if (property.color === "pink")
                    value += 450;

                //--------------------------------------------------
                // If MI can actually complete its own set too,
                // this becomes a double strategic win.
                //--------------------------------------------------

                if (owned + 1 >= required)
                    value += 1000;
            }

            //--------------------------------------------------
            // OPPONENT HAS TWO OF THREE
            //--------------------------------------------------

            else if (
                required === 3 &&
                opponentCount === 2
            ) {

                value += 1200;
            }

            //--------------------------------------------------
            // OPPONENT HAS ONE OF THREE
            //--------------------------------------------------

            else if (
                required === 3 &&
                opponentCount === 1
            ) {

                value += 250;
            }

            //--------------------------------------------------
            // RAILROAD BLOCKING
            //--------------------------------------------------

            if (
                property.color === "railroad" &&
                opponentCount === 3
            ) {

                value += 1800;
            }

            //--------------------------------------------------
            // UTILITY BLOCKING
            //--------------------------------------------------

            if (
                property.color === "utility" &&
                opponentCount === 1
            ) {

                value += 600;
            }
        }
    }

    //--------------------------------------------------
    // PROPERTY AS A TRADE WEAPON
    //--------------------------------------------------

    // A property becomes more valuable if owning it
    // gives MI leverage over another player.

    if (propertyOwners) {

        let playersNeedingProperty = 0;

        for (
            const [name, owner]
            of Object.entries(propertyOwners)
        ) {

            const p =
                containsProperty(name);

            if (!p)
                continue;

            // If this property completes an opponent's
            // set, it becomes a valuable bargaining chip.
            if (
                p.color === property.color
            ) {

                playersNeedingProperty++;
            }
        }

        if (playersNeedingProperty > 0) {

            value +=
                playersNeedingProperty *
                350;
        }
    }

    //--------------------------------------------------
    // MORTGAGED PROPERTY
    //--------------------------------------------------

    if (property.mortgaged) {

        value -=
            property.cost * 0.75;
    }

    //--------------------------------------------------
    // CASH SITUATION
    //--------------------------------------------------

    if (mi.money < 300) {

        // When nearly broke, MI should prefer properties
        // that generate immediate strategic value rather
        // than speculative assets.
        value *= 0.90;

    } else if (mi.money < 500) {

        value *= 0.95;

    } else if (mi.money > 1000) {

        // Wealth gives MI more ability to exploit
        // development opportunities.
        if (property.buildCost > 0)
            value *= 1.05;
    }

    //--------------------------------------------------
    // DEVELOPMENT ROI
    //--------------------------------------------------

    if (property.buildCost > 0) {

        const firstHouseGain =
            property.rent1 -
            property.rent;

        if (
            firstHouseGain /
            property.buildCost >= 0.8
        ) {

            value += 450;

        } else if (
            firstHouseGain /
            property.buildCost >= 0.5
        ) {

            value += 250;
        }
    }

    //--------------------------------------------------
    // ENDGAME VALUE
    //--------------------------------------------------

    // Expensive properties become more useful once MI
    // has enough capital to develop them.
    if (mi.money >= 1000) {

        if (
            property.cost >= 300 &&
            property.buildCost > 0
        ) {

            value += 250;
        }
    }

    //--------------------------------------------------
    // FINAL SANITY ADJUSTMENTS
    //--------------------------------------------------

    // Never let a normal property become worthless.
    value =
        Math.max(
            property.cost * 0.50,
            value
        );

    //--------------------------------------------------
    // ROUND
    //--------------------------------------------------

    return Math.round(value);
}

function completeTrade(trade) {


    if (!evaluateTrade(trade)) {

        return;
    }



    // Remove properties MI gives
    for (const item of trade.give) {

        if (item.startsWith("$")) {

            mi.money -= Number(
                item.replace("$", "")
            );

            continue;
        }


        const property = getOwnedProperty(item);

        if (property) {

            mi.properties.splice(
                mi.properties.indexOf(property),
                1
            );
        }
    }




    // Add properties MI receives
    for (const item of trade.receive) {


        if (item.startsWith("$")) {

            mi.money += Number(
                item.replace("$", "")
            );

            continue;
        }


        const property =
            containsProperty(item);


        if (property) {

            mi.properties.push({

                ...property,

                houses: 0,
                hotel: false,
                mortgaged: false

            });

            // MI now owns this property
            delete propertyOwners[property.name];
        }
    }



    show();


    log(
        "Trade completed."
    );

    lines++;
    update();


    buyHouses();
}
function processTrade(command) {


    command =
        command
        .replace("trade", "")
        .trim();



    const sections =
        command.split(" receive ");



    if (sections.length !== 2) {

        log(
            "Use: trade give X receive Y"
        );

        lines++;
        update();

        return;
    }



    let give =
        sections[0]
        .replace("give", "")
        .trim();



    let receive =
        sections[1]
        .trim();



    function splitItems(text) {


        return text
            .replaceAll(",", " and ")
            .split(" and ")
            .map(item => item.trim())
            .filter(item => item.length > 0);

    }



    const trade = {

        give:
            splitItems(give),


        receive:
            splitItems(receive)

    };



    completeTrade(trade);
}
function runVoiceCommand() {

    const text =
        document.getElementById("voiceInput")
        .value
        .toLowerCase();

    processVoice(text);

    document.getElementById("voiceInput").value = "";
}

function processVoice(text) {

    let command = text.trim();


    //--------------------------------------------------
    // SET PROPERTY OWNER
    // Example: owner Joe Boardwalk
    //--------------------------------------------------

    const ownerMatch =
        command.match(/^owner (.+?) (.+)$/);


    if (ownerMatch) {

        const player =
            ownerMatch[1].trim();


        const propertyName =
            ownerMatch[2].trim();


        if (containsProperty(propertyName)) {

            setOwner(
                propertyName,
                player
            );

            return;
        }
    }



    //--------------------------------------------------
    // TRANSFER PROPERTY OWNER
    // Example: transfer Boardwalk to Joe
    //--------------------------------------------------

    const transferMatch =
        command.match(/^transfer (.+?) to (.+)$/);


    if (transferMatch) {

        transferOwner(
            transferMatch[1].trim(),
            transferMatch[2].trim()
        );

        return;
    }



    //--------------------------------------------------
    // TRADE
    //--------------------------------------------------

    if (command.includes("trade")) {

        processTrade(command);

        return;
    }



    //--------------------------------------------------
    // PAY
    //--------------------------------------------------

    if (command.includes("pay")) {

        const number =
            command.match(/\d+/);


        if (number) {

            document.getElementById("payInput").value =
                Number(number[0]);


            payMoney();
        }


        return;
    }



    //--------------------------------------------------
    // RECEIVE PROPERTY
    //--------------------------------------------------

    if (
        command.includes("receive property") ||
        command.includes("received property") ||
        command.includes("buy property")
    ) {


        let propertyName = command

            .replace(/.*receive(d)? property/, "")

            .replace(/.*buy property/, "")

            .trim();



        document.getElementById("propertyName").value =
            propertyName;


        addProperty();


        return;
    }



    //--------------------------------------------------
    // RECEIVE MONEY
    //--------------------------------------------------

    if (
        command.includes("receive") ||
        command.includes("received") ||
        command.includes("collect") ||
        command.includes("got")
    ) {


        // Prevent "got Boardwalk" from becoming money
        if (containsProperty(command))
            return;


        const number =
            command.match(/\d+/);


        if (number) {

            document.getElementById("moneyInput").value =
                Number(number[0]);


            receiveMoney();
        }


        return;
    }



    //--------------------------------------------------
    // LAND ON
    //--------------------------------------------------

    if (
        command.includes("land on") ||
        command.includes("landed on")
    ) {


        let propertyName = command

            .replace(/.*land(ed)? on/, "")

            .trim();



        document.getElementById("propertyName").value =
            propertyName;


        property();


        return;
    }



    //--------------------------------------------------
    // AUCTION
    //--------------------------------------------------

    if (command.includes("auction")) {


        let propertyName = command

            .replace(/.*auction/, "")

            .trim();



        document.getElementById("propertyName").value =
            propertyName;


        auctionProperty();


        return;
    }



    //--------------------------------------------------
    // UNKNOWN COMMAND
    //--------------------------------------------------

    log(
        "MI did not understand: " + command
    );

    lines++;
    update();
}



run();
