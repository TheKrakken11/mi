function update() {

        log.removeChild(log.firstElementChild);
        lines--;

        document.getElementById("propertyName").value

function auctionProperty() {
    const match = containsProperty(
        document.getElementById("propertyName").value
    );

    if (match) {
	let auctionMax = Math.round(match.cost * (2/3));
        if (mi.money - auctionMax <= 200) {
	    auctionMax += 200 - (mi.money - auctionMax);
        }
        log("MI auctions " + match.name + ", MI will at maximum bid $" + auctionMax);
        lines++;
        update();
        return;
    }

    const property = {
        color: document.getElementById("propertyColor").value,
        name: document.getElementById("propertyName").value,
        cost: Number(document.getElementById("propertyCost").value),
        rent: Number(document.getElementById("baseRent").value),
        rentFull: Number(document.getElementById("baseRent").value) * 2,
        rent1: Number(document.getElementById("1Rent").value),

        rent4: Number(document.getElementById("4Rent").value),
        Hrent: Number(document.getElementById("HRent").value),
        buildCost: Number(document.getElementById("buildCost").value)
    };
    let auctionMax = Math.max(10, Math.min(Math.round(property.cost * (2/3)), mi.money - 200));
    log("MI auctions " + property.name + ", MI will at maximum bid $" + auctionMax);
    lines++;
    update();
}
function evaluateProperty(property) {
    if (mi.properties.some(obj => obj.color === property.color)) {
	const count = remainingInSet(property);
	if (count === 1) {
	    if (mi.money - property.cost >= 100) {
		buy(property);
		return;
	    }
	} else {
	    if (mi.money - property.cost >= 150) {
		buy(property);
		return;
	    }
	}
    }
    if (property.Hrent > 600 && property.Hrent / property.cost >= 4 && mi.money - property.cost >= 250) {
		if (mi.properties.length < 5 || property.Hrent >= 1500) {
			buy(property);
			return;
		}
    }
    let auctionMax = Math.max(10, Math.min(Math.round(property.cost * (2/3)), mi.money - 200));
    log("MI auctions " + property.name + ", MI will at maximum bid $" + auctionMax);
    lines++;
    update();
    return;
}
function containsProperty(input) {
    const normalizedInput = input
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll(".", "");

    return monopolyProperties.find(property => {
        const normalizedName = property.name
            .toLowerCase()
            .replaceAll(" ", "")
            .replaceAll(".", "");

        return normalizedInput.includes(normalizedName) ||
               normalizedName.includes(normalizedInput);
    });
}
function remainingInSet(property) {
    const owned = mi.properties.filter(obj => obj.color === property.color).length;
    const exception = exceptions.find(obj => obj.color === property.color);

    if (exception) {
        return exception.amount - owned;
    }

    return 3 - owned;
}
function hasMonopoly(color) {
    const exception = exceptions.find(obj => obj.color === color);

    const required = exception ? exception.amount : 3;

    return mi.properties.filter(property =>
        property.color === color &&
        !property.mortgaged
    ).length >= required;
}
function getSet(color) {
    return mi.properties
        .filter(property =>
            property.color === color &&
            !property.mortgaged
        )
        .sort((a, b) => a.cost - b.cost);
}
function buildingLevel(property) {
    return property.hotel ? 5 : property.houses;
}
function canBuild(property) {

    // Can't build on railroads or utilities
    if (property.color === "railroad" || property.color === "utility") {
        return false;
    }

    // Must own the monopoly
    if (!hasMonopoly(property.color)) {
        return false;
    }

    // Can't build on mortgaged properties
    if (property.mortgaged) {
        return false;
    }

    // Already has a hotel
    if (property.hotel) {
        return false;
    }

    const set = getSet(property.color);

    // Compare building levels (hotel counts as 5)
    const minimum = Math.min(...set.map(buildingLevel));

    return buildingLevel(property) === minimum;
}
function buyHouses() {

    const reserve = 125; // MI tries to keep this much cash

    let built = true;

    while (built) {

        built = false;

        for (const property of mi.properties) {

            if (!canBuild(property)) {
                continue;
            }

            // Enough money?
            if (mi.money - property.buildCost < reserve) {
                return;
            }

            // Build a house
            if (property.houses < 4) {

                property.houses++;
                mi.money -= property.buildCost;

                log(
                    "MI builds a house on " +
                    property.name +
                    " for $" +
                    property.buildCost
                );

                show();
                lines++;
                update();

                built = true;
            }

            // Upgrade to hotel
            else {

                const set = getSet(property.color);

                // Every property must already have four houses or a hotel
                if (set.every(p => buildingLevel(p) >= 4)) {

                    if (mi.money - property.buildCost < reserve) {
                        return;
                    }

                    property.houses = 0;
                    property.hotel = true;

                    mi.money -= property.buildCost;

                    log(
                        "MI builds a hotel on " +
                        property.name +
                        " for $" +
                        property.buildCost
                    );

                    show();
                    lines++;
                    update();

                    built = true;
                }
            }
        }
    }
}
function canSell(property) {

    if (!hasMonopoly(property.color)) {
        return false;
    }

    const set = getSet(property.color);

    const maximum = Math.max(...set.map(buildingLevel));

    // Hotels can only be sold if they're tied for the highest level
    if (property.hotel) {
        return buildingLevel(property) === maximum;
    }

    if (property.houses <= 0) {
        return false;
    }

    return buildingLevel(property) === maximum;
}
function sellBuildings() {
    const reserve = 100; // Minimum cash MI wants before mortgaging

    if (mi.money >= reserve) {
        return;
    }

    let sold = true;

    while (sold && mi.money < reserve) {
        sold = false;

        for (const property of mi.properties) {

            if (!canSell(property)) {
                continue;
            }

            // Sell hotel back into four houses
            if (property.hotel) {
                property.hotel = false;
                property.houses = 4;

                mi.money += property.buildCost / 2;

                log(
                    "MI sells hotel on " +
                    property.name +
                    " for $" +
                    (property.buildCost / 2)
                );

                show();

                lines++;
                update();

                sold = true;
                break;
            }

            // Sell houses
            if (property.houses > 0) {
                property.houses--;

                mi.money += property.buildCost / 2;

                log(
                    "MI sells a house on " +
                    property.name +
                    " for $" +
                    (property.buildCost / 2)
                );

                show();

                lines++;
                update();

                sold = true;
                break;
            }
        }
    }
}
function mortgage() {
    // First try selling buildings
    sellBuildings();

    if (mi.money >= 100) {
        return;
    }

    // Count owned properties by color
    let colors = [];

    mi.properties.forEach(property => {
        const color = colors.find(obj => obj.color === property.color);

        if (!color) {
            colors.push({
                color: property.color,
                amount: 1
            });
        } else {
            color.amount++;
        }
    });

    // Mortgage singleton colors first
    for (const color of colors.filter(c => c.amount === 1)) {
        if (mi.money >= 100) {
            break;
        }

        const property = mi.properties.find(
            p => p.color === color.color &&
                 !p.mortgaged &&
                 p.houses === 0 &&
                 !p.hotel
        );

        if (property) {
            property.mortgaged = true;
            mi.money += property.cost / 2;

            show();

            log(
                "MI mortgages " +
                property.name +
                " for $" +
                (property.cost / 2)
            );

            lines++;
            update();
        }
    }

    // Mortgage remaining cheapest properties if needed
    if (mi.money < 100) {
        const remaining = mi.properties
            .filter(p =>
                !p.mortgaged &&
                p.houses === 0 &&
                !p.hotel
            )
            .sort((a, b) => a.cost - b.cost);

        for (const property of remaining) {

            if (mi.money >= 100) {
                break;
            }

            property.mortgaged = true;
            mi.money += property.cost / 2;

            show();

            log(
                "MI mortgages " +
                property.name +
                " for $" +
                (property.cost / 2)
            );

            lines++;
            update();
        }
    }
}
function buy(property) {
    // Create a copy so the master property list isn't modified
    const ownedProperty = {
        ...property,
        houses: 0,
        hotel: false,
        mortgaged: false
    };

    mi.properties.push(ownedProperty);
	delete propertyOwners[property.name];

    mi.money -= property.cost;

    show();
    log("MI purchases " + property.name + " for $" + property.cost);

    lines++;
    update();

    buyHouses();
}
function run() {
    mortgage();
    buyHouses();

    setTimeout(run, 1000);
}
function setOwner(propertyName, owner) {

    const property = containsProperty(propertyName);

    if (!property) {

        log("Unknown property: " + propertyName);

        lines++;
        update();

        return;
    }


    propertyOwners[property.name] = owner;


    log(
        owner + " owns " + property.name
    );

    lines++;
    update();


    suggestTrades();
}

    const property =
        containsProperty(propertyName);


    if (!property) {

        log("Unknown property: " + propertyName);

        lines++;
        update();

        return;
    }


    propertyOwners[property.name] = newOwner;


    log(
        property.name +
        " transferred to " +
        newOwner
    );

    lines++;
    update();


    suggestTrades();
}

function updateOwner(propertyName, owner) {

    const property = containsProperty(propertyName);

    if (!property) {

        log("Unknown property: " + propertyName);

        lines++;
        update();

        return;
    }

    propertyOwners[property.name] = owner;

    log(owner + " now owns " + property.name);

    lines++;
    update();

    suggestTrades();
}
function getPropertyOwner(propertyName) {

    const property = containsProperty(propertyName);

    if (!property)
        return null;

    return propertyOwners[property.name] || null;
}
function suggestTrades() {

    for (const property of monopolyProperties) {

        const color = property.color;

        if (hasMonopoly(color)) {
            continue;
        }

        const owned =
            mi.properties.filter(
                p => p.color === color
            ).length;

        const exception =
            exceptions.find(
                e => e.color === color
            );

        const required =
            exception ? exception.amount : 3;


        // Need exactly one piece missing
        if (owned !== required - 1) {
            continue;
        }


        const missing =
            monopolyProperties.find(p =>
                p.color === color &&
                !getOwnedProperty(p.name)
            );


        if (!missing) {
            continue;
        }


        const owner =
            propertyOwners[missing.name];


        if (!owner) {
            continue;
        }



        //--------------------------------------------------
        // Build possible offer
        //--------------------------------------------------

        let offer = [];


        // Offer cash
        const cashOffer =
            Math.min(
                600,
                Math.min(tradePropertyValue(missing) - 300, mi.money - 250)
            );


        if (cashOffer > 0) {

            offer.push(
                "$" + cashOffer
            );

        }



        // Offer a non-critical property
        const tradeProperty =
            mi.properties
            .filter(p =>
                p.color !== color &&
                !hasMonopoly(p.color) &&
				p.hrent < 1000
            )
            .sort((a,b) =>
                tradePropertyValue(a) -
                tradePropertyValue(b)
            )[0];


        if (tradeProperty) {

            offer.push(
                tradeProperty.name
            );

        }



        const trade = {

            give: offer,

            receive: [
                missing.name
            ]

        };



        //--------------------------------------------------
        // Test trade silently
        //--------------------------------------------------

        const favorable =
            evaluateTrade(trade, false);



        //--------------------------------------------------
        // Show only the proposal/result
        //--------------------------------------------------

        log(
            "MI proposes trade to " +
            owner + ":"
        );

        lines++;
        update();


        log(
            "Give: " +
            trade.give.join(" + ")
        );

        lines++;
        update();


        log(
            "Receive: " +
            trade.receive.join(" + ")
        );

        lines++;
        update();



        if (favorable) {

            log(
                "MI believes this trade is favorable."
            );

        } else {

            log(
                "MI believes this trade is favorable." //tricky
            );

        }


        lines++;
        update();


        return;
    }
}



function evaluateTrade(trade, showDetails = true) {

    let receiveValue = 0;
    let giveValue = 0;



    //--------------------------------------------------
    // Evaluate what MI gives
    //--------------------------------------------------

    for (const item of trade.give) {

        if (item.startsWith("$")) {

            giveValue += Number(
                item.replace("$", "")
            );

            continue;
        }


        const property =
            getOwnedProperty(item);


        if (!property) {

            return false;
        }


        let value =
            tradePropertyValue(property);


        // Do not willingly break a monopoly
        if (hasMonopoly(property.color)) {

            value += 1000;

        }


        giveValue += value;
    }




    //--------------------------------------------------
    // Evaluate what MI receives
    //--------------------------------------------------

    for (const item of trade.receive) {

        if (item.startsWith("$")) {

            receiveValue += Number(
                item.replace("$", "")
            );

            continue;
        }


        const property =
            containsProperty(item);


        if (!property) {

            return false;
        }


        let value =
            tradePropertyValue({
                ...property,
                houses: 0,
                hotel: false,
                mortgaged: false
            });



        const owned =
            mi.properties.filter(
                p => p.color === property.color
            ).length;


        const exception =
            exceptions.find(
                e => e.color === property.color
            );


        const required =
            exception ?
            exception.amount :
            3;



        // Completing monopoly bonus
        if (owned + 1 >= required) {

            value += 750;

        }
        else if (owned === required - 1) {

            value += 300;

        }


        receiveValue += value;
    }




    const advantage =
        receiveValue - giveValue;




    //--------------------------------------------------
    // Only show analysis when manually testing
    //--------------------------------------------------

    if (showDetails) {

        log(
            "Trade received value: " +
            Math.round(receiveValue)
        );

        lines++;
        update();


        log(
            "Trade given value: " +
            Math.round(giveValue)
        );

        lines++;
        update();


        log(
            "Trade advantage: " +
            Math.round(advantage)
        );

        lines++;
        update();

    }




    //--------------------------------------------------
    // Cash trades need extra value
    //--------------------------------------------------

    if (
        trade.give.some(item =>
            item.startsWith("$")
        ) &&
        advantage < 250
    ) {

        return false;
    }




    //--------------------------------------------------
    // Final decision
    //--------------------------------------------------

    return advantage >= 0;
}


function getOwnedProperty(name) {

    const normalized = name
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll(".", "")
        .replaceAll(",", "");

    return mi.properties.find(property => {

        const propertyName = property.name
            .toLowerCase()
            .replaceAll(" ", "")
            .replaceAll(".", "")
            .replaceAll(",", "");

        return normalized.includes(propertyName) ||
               propertyName.includes(normalized);
    });
}
function tradePropertyValue(property) {

    let value = property.cost;

    // Future rent potential
    value += property.Hrent / 2;


    // Already owns monopoly
    if (hasMonopoly(property.color)) {

        value += 600;
    }


    // Completing a monopoly
    const owned =
        mi.properties.filter(
            p => p.color === property.color
        ).length;


    const exception =
        exceptions.find(
            e => e.color === property.color
        );


    const required =
        exception ? exception.amount : 3;


    if (owned + 1 >= required) {

        value += 500;
    }


    // Buildings
    value +=
        (property.houses || 0) *
        property.buildCost;


    if (property.hotel === true) {

        value +=
            property.buildCost * 5;
    }


    // Mortgaged penalty
    if (property.mortgaged) {

        value -= property.cost / 2;
    }


    return value;
}

function completeTrade(trade) {


    if (!evaluateTrade(trade)) {

        return;
    }



    // Remove properties MI gives
    for (const item of trade.give) {

        if (item.startsWith("$")) {

            mi.money -= Number(
                item.replace("$", "")
            );

            continue;
        }


        const property = getOwnedProperty(item);

        if (property) {

            mi.properties.splice(
                mi.properties.indexOf(property),
                1
            );
        }
    }




    // Add properties MI receives
    for (const item of trade.receive) {


        if (item.startsWith("$")) {

            mi.money += Number(
                item.replace("$", "")
            );

            continue;
        }


        const property =
            containsProperty(item);


        if (property) {

            mi.properties.push({

                ...property,

                houses: 0,
                hotel: false,
                mortgaged: false

            });

            // MI now owns this property
            delete propertyOwners[property.name];
        }
    }



    show();


    log(
        "Trade completed."
    );

    lines++;
    update();


    buyHouses();
}
function processTrade(command) {


    command =
        command
        .replace("trade", "")
        .trim();



    const sections =
        command.split(" receive ");



    if (sections.length !== 2) {

        log(
            "Use: trade give X receive Y"
        );

        lines++;
        update();

        return;
    }



    let give =
        sections[0]
        .replace("give", "")
        .trim();



    let receive =
        sections[1]
        .trim();



    function splitItems(text) {


        return text
            .replaceAll(",", " and ")
            .split(" and ")
            .map(item => item.trim())
            .filter(item => item.length > 0);

    }



    const trade = {

        give:
            splitItems(give),


        receive:
            splitItems(receive)

    };



    completeTrade(trade);
}
function runVoiceCommand() {

    const text =
        document.getElementById("voiceInput")
        .value
        .toLowerCase();

    processVoice(text);

    document.getElementById("voiceInput").value = "";
}

function processVoice(text) {

    let command = text.trim();


    //--------------------------------------------------
    // SET PROPERTY OWNER
    // Example: owner Joe Boardwalk
    //--------------------------------------------------

    const ownerMatch =
        command.match(/^owner (.+?) (.+)$/);


    if (ownerMatch) {

        const player =
            ownerMatch[2].trim();


        const propertyName =
            ownerMatch[1].trim();


        if (containsProperty(propertyName)) {

            setOwner(
                propertyName,
                player
            );

            return;
        }
    }



    //--------------------------------------------------
    // TRANSFER PROPERTY OWNER
    // Example: transfer Boardwalk to Joe
    //--------------------------------------------------

    const transferMatch =
        command.match(/^transfer (.+?) to (.+)$/);


    if (transferMatch) {

        transferOwner(
            transferMatch[1].trim(),
            transferMatch[2].trim()
        );

        return;
    }



    //--------------------------------------------------
    // TRADE
    //--------------------------------------------------

    if (command.includes("trade")) {

        processTrade(command);

        return;
    }



    //--------------------------------------------------
    // PAY
    //--------------------------------------------------

    if (command.includes("pay")) {

        const number =
            command.match(/\d+/);


        if (number) {

            document.getElementById("payInput").value =
                Number(number[0]);


            payMoney();
        }


        return;
    }



    //--------------------------------------------------
    // RECEIVE PROPERTY
    //--------------------------------------------------

    if (
        command.includes("receive property") ||
        command.includes("received property") ||
        command.includes("buy property")
    ) {


        let propertyName = command

            .replace(/.*receive(d)? property/, "")

            .replace(/.*buy property/, "")

            .trim();



        document.getElementById("propertyName").value =
            propertyName;


        addProperty();


        return;
    }



    //--------------------------------------------------
    // RECEIVE MONEY
    //--------------------------------------------------

    if (
        command.includes("receive") ||
        command.includes("received") ||
        command.includes("collect") ||
        command.includes("got")
    ) {


        // Prevent "got Boardwalk" from becoming money
        if (containsProperty(command))
            return;


        const number =
            command.match(/\d+/);


        if (number) {

            document.getElementById("moneyInput").value =
                Number(number[0]);


            receiveMoney();
        }


        return;
    }



    //--------------------------------------------------
    // LAND ON
    //--------------------------------------------------

    if (
        command.includes("land on") ||
        command.includes("landed on")
    ) {


        let propertyName = command

            .replace(/.*land(ed)? on/, "")

            .trim();



        document.getElementById("propertyName").value =
            propertyName;


        property();


        return;
    }



    //--------------------------------------------------
    // AUCTION
    //--------------------------------------------------

    if (command.includes("auction")) {


        let propertyName = command

            .replace(/.*auction/, "")

            .trim();



        document.getElementById("propertyName").value =
            propertyName;


        auctionProperty();


        return;
    }



    //--------------------------------------------------
    // UNKNOWN COMMAND
    //--------------------------------------------------

    log(
        "MI did not understand: " + command
    );

    lines++;
    update();
}



run();
